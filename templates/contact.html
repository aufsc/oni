{% extends "base.html" %}
{% block title %}联系我们 - {{ SITE.name }}{% endblock %}
{% block body %}
    <div class="page-header"><h1>联系我们</h1><p>有任何问题或合作意向，欢迎随时联系</p></div>
    <div class="container">
        <div class="contact-grid">
            <a href="mailto:contact@example.com" class="contact-card"><div class="contact-card-icon"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><polyline points="2,4 12,13 22,4"/></svg></div><div class="contact-card-title">电子邮件</div><div class="contact-card-value">contact@example.com</div></a>
            <a href="mailto:editor@example.com" class="contact-card"><div class="contact-card-icon"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></div><div class="contact-card-title">投稿邮箱</div><div class="contact-card-value">editor@example.com</div></a>
            <a href="mailto:support@example.com" class="contact-card"><div class="contact-card-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></div><div class="contact-card-title">技术支持</div><div class="contact-card-value">support@example.com</div></a>
            <a href="mailto:collab@example.com" class="contact-card"><div class="contact-card-icon"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div class="contact-card-title">商务合作</div><div class="contact-card-value">collab@example.com</div></a>
        </div>
        <div class="form-section">
            <h2>发送留言</h2>
            <div class="form-group"><label for="msgName">您的姓名</label><input type="text" placeholder="请输入您的姓名" id="msgName" autocomplete="name"></div>
            <div class="form-group"><label for="msgEmail">电子邮箱</label><input type="email" placeholder="your@email.com" id="msgEmail" autocomplete="email"></div>
            <div class="form-group"><label for="msgSubject">主题</label><input type="text" placeholder="请简要描述您的问题或来意" id="msgSubject"></div>
            <div class="form-group"><label for="msgBody">留言内容</label><textarea placeholder="请在此详细描述..." id="msgBody"></textarea></div>
            <button type="button" class="submit-btn" id="sendMailBtn">通过邮件发送</button>
            <p class="form-note">点击按钮将打开您的邮件客户端</p>
        </div>
    </div>
{% endblock %}
{% block scripts %}
    <script>
        document.getElementById('sendMailBtn').addEventListener('click', () => {
            const v = id => document.getElementById(id).value.trim();
            const subject = v('msgSubject') || '来自博客的留言';
            const body = `姓名：${v('msgName')}\n邮箱：${v('msgEmail')}\n\n${v('msgBody')}`;
            window.location.href = `mailto:{{ SITE.email }}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        });
    </script>
{% endblock %}
